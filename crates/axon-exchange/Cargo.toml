[package]
name = "axon-exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "交易所对接：REST + WebSocket，Binance/OKX 适配器"

[dependencies]
axon-core = { path = "../axon-core" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# tokio-tungstenite 的 rustls-tls-webpki-roots 拉入的 rustls 不带任何 CryptoProvider
# feature；在 pyo3 .so 构建图（reqwest/alloy 的 provider 链被裁掉）里，
# ClientConfig::builder() 因无法自动选择 provider 直接 panic，WSS 首次真网连接即炸。
# 连接处（adapters::connect_wss）用 builder_with_provider(ring) 显式指定，
# 不依赖进程级 default 与 crate feature 自动检测（避免 ring+aws-lc-rs 并存的 ambiguous）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
wiremock = "0.6"
rust_decimal_macros = "1"

[features]
default = []
# Stage 5:Python 绑定开关。`auto-initialize` 让 `cargo test` 嵌入式 Python
# 自动 init;`rust_decimal` 已在主依赖,无需重复加。
python = ["dep:pyo3", "axon-core/python-utils"]

[dependencies.pyo3]
version = "0.28"
optional = true
features = ["auto-initialize"]
