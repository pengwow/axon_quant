name: Publish to TestPyPI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== 构建 Wheels ====================
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # requires-python = ">=3.13,<3.15"（pyproject.toml）；不能开 abi3
        # （pyo3-arrow 的 buffer protocol 与之互斥），wheel 仅以 3.14 构建
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install build tools
        run: pip install maturin

      - name: Build wheel
        id: build
        run: maturin build --release --out dist
        env:
          PYO3_PYTHON: ${{ matrix.python-version }}
        continue-on-error: true # 首次失败交给重试链兜底，不立即判 job 红

      # 重试链语义：仅在前序真的失败时接棒（outcome 精确衔接，避免原 if: failure()
      # 在前序已成功时仍触发的重复编译）；前两步 continue-on-error: true，
      # 最终成败由末步 retry 2 裁决——它失败则 job 红、成功则 job 绿
      - name: Build wheel (retry 1)
        id: retry1
        if: steps.build.outcome == 'failure'
        run: maturin build --release --out dist
        env:
          PYO3_PYTHON: ${{ matrix.python-version }}
        continue-on-error: true

      - name: Build wheel (retry 2)
        if: steps.build.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: maturin build --release --out dist
        env:
          PYO3_PYTHON: ${{ matrix.python-version }}

      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*

  # ==================== 汇总 Artifacts ====================
  collect-artifacts:
    name: Collect artifacts
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ==================== 发布到 TestPyPI ====================
  publish-testpypi:
    name: Publish to TestPyPI
    needs: collect-artifacts
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true
