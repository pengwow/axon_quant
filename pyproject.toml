[project]
name = "axon-quant"
version = "0.11.0"
description = "AI-native quantitative trading framework — high-performance Rust core with Python RL training interface, covering backtesting, training, optimization, validation and production in a single codebase."
authors = [{ name = "pengwow", email = "pengwow@hotmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/pengwow/axon_quant"
Repository = "https://github.com/pengwow/axon_quant"
Documentation = "https://github.com/pengwow/axon_quant"
Issues = "https://github.com/pengwow/axon_quant/issues"

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.21.0",
]
rl = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# 根 Cargo.toml 是纯 workspace 配置(无 [package] 段),需显式指向
# axon-python crate,其 [lib] 名为 `_native`,包含全部 PyO3 绑定。
manifest-path = "crates/axon-python/Cargo.toml"
# 启用 axon-python 的 `python` feature,让 pyo3(optional 依赖)出现在
# cargo metadata 依赖图中,maturin 才能识别为 pyo3 绑定。
features = ["python"]
python-source = "python"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --new-first --failed-first"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
